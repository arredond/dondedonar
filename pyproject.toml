[project]
name = "dondedonar"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bs4>=0.0.2",
    "certifi>=2026.7.22",
    "curl-cffi>=0.16.3",
    "dotenv>=0.9.9",
    "geoalchemy2>=0.20.0",
    "geopandas>=1.1.4",
    "googlemaps>=4.10.0",
    "here-location-services>=0.4.0",
    "html5lib>=1.1",
    "lxml>=6.1.1",
    "numpy>=2.5.2",
    "opening-hours-py>=2.1.4",
    "pandas>=3.0.5",
    "pillow>=13.0.0",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.52",
    "tqdm>=4.70.0",
    "unidecode>=1.4.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyrefly>=1.4.0",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "responses>=0.26.3",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["etl/tests"]
addopts = "-m 'not integration'"
markers = ["integration: hits real external URLs; run with -m integration"]

[tool.pyrefly]
project-includes = ["etl", "main.py"]
search-path = ["etl"]
